# Builds the Nacos Server as a GraalVM Native Image and tests the executable: the repository's
# standalone-server integration suites against PostgreSQL and MySQL, and the tests of the module
# test/native-test, which start their databases and infrastructure with Testcontainers, for what the
# suites cannot reach (the AI registries, DNS, the Kubernetes sync, a third-party plugin, a cluster).
# What a build contains is fixed when it is built, so every scenario is a build of its own.
#
# Native compilation peaks at about 12 GB of RAM, so this job runs on GitHub-hosted runners instead
# of the self-hosted pull request checks. Every step only calls a stage of test/scripts/native-ci.sh,
# which is also the way to reproduce the job elsewhere. See bootstrap/README-AOT.md.
#
# To run it on a fork without opening a pull request, push a branch named native-ci/<name>.

name: Native Image

on:
  workflow_dispatch:
  pull_request:
    branches: [ develop ]
    paths:
      - 'bootstrap/**'
      - 'distribution/bin/startup-native.sh'
      - 'distribution/release-native.xml'
      - 'distribution/pom.xml'
      - '**/META-INF/native-image/**'
      - 'test/scripts/native-*'
      - 'test/native-test/**'
      - 'test/native-test-plugin/**'
      - '.github/workflows/native-image.yml'
  push:
    branches: [ 'native-ci/**' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-image:
    name: Native Server (${{ matrix.scenario }}, ${{ matrix.database }}, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The datasource, the AI registries, the Kubernetes sync, the plugins and the mode of the
        # cluster are structural choices of the build, so every scenario and every database is built
        # on its own (see the header of test/scripts/native-ci.sh). 'exact' builds with
        # --exact-reachability-metadata and reports every dynamic access that has no metadata, which
        # is how gaps in the bundled metadata are found. MySQL runs the core OpenAPI classes, which is
        # enough to exercise its driver. The cluster scenario runs no suites.
        include:
          - { scenario: standard, database: postgresql, variant: default, suite: full }
          - { scenario: standard, database: postgresql, variant: exact, suite: full }
          - { scenario: standard, database: mysql, variant: default, suite: core }
          - { scenario: standard, database: mysql, variant: exact, suite: core }
          - { scenario: features, database: postgresql, variant: default, suite: full }
          - { scenario: features, database: postgresql, variant: exact, suite: full }
          - { scenario: cluster, database: postgresql, variant: default, suite: core }
          - { scenario: cluster, database: postgresql, variant: exact, suite: core }
    env:
      NATIVE_CI_SCENARIO: ${{ matrix.scenario }}
      NATIVE_CI_DATABASE: ${{ matrix.database }}
      NATIVE_CI_VARIANT: ${{ matrix.variant }}
      NATIVE_CI_SUITE: ${{ matrix.suite }}
      NATIVE_CI_OUT: ${{ github.workspace }}/ci-out
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM Community 25.0.4
        uses: graalvm/setup-graalvm@v1
        with:
          # GraalVM Community 25 Innovation 2 (graal 25.2.4, JDK 25.0.4). A java-version of '25'
          # alone resolves to the last jdk-25.* release, 25.0.2.
          version: '25.2'
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Select the scenario and the build options
        run: bash test/scripts/native-ci.sh prepare

      - name: Build the Native distribution
        id: build
        run: bash test/scripts/native-ci.sh build

      # Testcontainers starts the databases and the Servers of the tests that follow. The tests do
      # not depend on each other, so each of them runs once the build has succeeded.
      - name: Smoke test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash test/scripts/native-ci.sh smoke

      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash test/scripts/native-ci.sh integration

      - name: Scenario tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash test/scripts/native-ci.sh scenario

      - name: Report
        if: ${{ !cancelled() }}
        run: bash test/scripts/native-ci.sh report

      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-${{ matrix.scenario }}-${{ matrix.database }}-${{ matrix.variant }}
          path: ci-out
          if-no-files-found: ignore
